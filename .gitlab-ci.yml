stages:
  - lint
  - build
  - smoke

default:
  interruptible: true

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

cache:
  key: "$CI_JOB_NAME"
  paths:
    - .npm/

lint_next_admin:
  stage: lint
  image: node:20
  script:
    - npm ci
    - npm run lint

build_next_admin:
  stage: build
  image: node:20
  variables:
    # Prisma requires DATABASE_URL to be defined even for `prisma generate`.
    # Scoped to this job to avoid breaking docker-compose in other jobs.
    DATABASE_URL: "mysql://ci:ci@127.0.0.1:3306/healthia_ci"
  script:
    - npm ci
    - npm run prisma:generate
    - npm run build

lint_build_backoffice:
  stage: build
  image: node:20
  script:
    - npm ci
    - cd app
    - npm ci
    - npm run lint
    - npm run build

python_syntax:
  stage: lint
  image: python:3.11
  script:
    - python -m py_compile run_pipeline.py
    - python -m compileall -q api medaillon scraping

# Manual end-to-end smoke job.
# Runs the docker-compose stack, the ingestion pipeline, then seeds demo enterprises/users.
smoke_stack_pipeline_seed:
  stage: smoke
  image: docker:27
  services:
    - name: docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    COMPOSE_PROFILES: tools
    # Keep MySQL healthcheck working in CI (compose uses -proot).
    MYSQL_ROOT_PASSWORD: "root"
    # Override these in CI variables if needed.
    ENTERPRISE_COUNT: "5"
    USERS_PER_ENTERPRISE: "30"
    ENTERPRISE_PASSWORD: "Enterprise123!"
  rules:
    - when: manual
  script:
    - apk add --no-cache docker-cli-compose bash
    - |
      # Ensure docker-compose gets a coherent DB config.
      # If GitLab project variables define DATABASE_URL with a different password than MYSQL_PASSWORD,
      # compose would start MySQL with one password and apps would connect with another -> access denied.
      export MYSQL_USER="${MYSQL_USER:-healthia}"
      export MYSQL_PASSWORD="${MYSQL_PASSWORD:-healthia}"
      export MYSQL_DATABASE="${MYSQL_DATABASE:-healthia_api}"
      export DATABASE_URL="mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}"
      export TRAINING_DATABASE_URL="mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/healthia"
    - docker version
    - docker compose version
    - docker compose up -d --build
    - |
      echo "Waiting for MySQL to be healthy..."
      for i in $(seq 1 60); do
        if docker compose exec -T db mysqladmin ping -h localhost -uroot -proot --silent; then
          echo "MySQL is up"
          break
        fi
        sleep 2
      done
    - |
      if [ -z "${KAGGLE_USERNAME:-}" ] || [ -z "${KAGGLE_KEY:-}" ]; then
        echo "Missing Kaggle credentials in CI. Set KAGGLE_USERNAME and KAGGLE_KEY as GitLab CI/CD variables." >&2
        exit 2
      fi
    - docker compose --profile tools run --rm -e KAGGLE_USERNAME -e KAGGLE_KEY ingest sh -c "pip install --no-cache-dir -r requirements.txt && python run_pipeline.py"
    - docker compose exec -T api node scripts/create_enterprises.js --count "${ENTERPRISE_COUNT}" --password "${ENTERPRISE_PASSWORD}"
    - docker compose --profile tools run --rm -e KAGGLE_USERNAME -e KAGGLE_KEY ingest sh -c "pip install --no-cache-dir -r requirements.txt && python scripts/seed_static_users.py create --count \"${USERS_PER_ENTERPRISE}\""
  after_script:
    - docker compose down -v
