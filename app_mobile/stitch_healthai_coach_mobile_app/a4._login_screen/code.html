<h1 class="font-h1-editorial text-h1-editorial text-on-surface text-center">Content de te revoir</h1>

<!-- Login Form -->
<div class="w-full max-w-md bg-surface-container-lowest rounded-xl shadow-[0_8px_30px_rgb(26,34,56,0.04)] p-8 border border-outline-variant/30">
<form class="flex flex-col gap-stack-gap">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-bold text-label-bold text-on-surface-variant" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-[#FFFCF7] border border-on-background/10 rounded-xl focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-outline outline-none transition-colors" id="email" name="email" placeholder="ton.adresse@email.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<label class="font-label-bold text-label-bold text-on-surface-variant" for="password">Mot de passe</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full pl-11 pr-4 py-3 bg-[#FFFCF7] border border-on-background/10 rounded-xl focus:border-primary focus:ring-1 focus:ring-primary font-body-md text-body-md text-on-surface placeholder:text-outline outline-none transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-1">
<a class="font-body-md text-[14px] text-primary hover:text-primary-container transition-colors" href="#">Mot de passe oublié ?</a>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full mt-stack-gap bg-on-secondary-fixed hover:bg-on-background text-on-primary font-label-bold text-label-bold py-4 rounded-full transition-colors flex items-center justify-center gap-2 shadow-sm" type="submit">
                Se connecter
                <span class="material-symbols-outlined text-[18px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Sign Up Link -->
<div class="w-full max-w-md mt-section-gap text-center">
