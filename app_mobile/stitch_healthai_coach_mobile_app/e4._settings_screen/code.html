<!DOCTYPE html>

<style>
        /* Base styles for material symbols to ensure correct rendering */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background-color: rgba(22, 29, 28, 0.1); border-radius: 10px; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-white">
<!-- iOS Status Bar Simulation -->
<div class="w-full h-12 flex justify-between items-center px-6 pt-2 text-[15px] font-semibold tracking-tight z-50 bg-background/90 backdrop-blur-md sticky top-0">
<div>09:05</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">wifi</span>
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</div>
<!-- Header (Task-Focused Page: Adapted from TopAppBar) -->
<header class="w-full px-6 py-4 flex items-center justify-between sticky top-12 bg-background/90 backdrop-blur-md z-40">
<button aria-label="Retour" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors group cursor-pointer">
<span class="material-symbols-outlined text-on-background group-hover:text-primary-container transition-colors">arrow_back</span>
</button>
<h1 class="font-h2-editorial text-h2-editorial text-on-background absolute left-1/2 -translate-x-1/2">Paramètres</h1>
<div class="w-10 h-10"></div> <!-- Spacer for perfect centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-container-padding py-stack-gap pb-[100px] flex flex-col gap-section-gap">
<!-- Section: Compte -->
<section class="flex flex-col gap-base">
<h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider pl-4">Compte</h2>
<div class="bg-surface-container-lowest rounded-[16px] overflow-hidden shadow-[0_2px_10px_0_rgba(26,34,56,0.02)] border border-outline-variant/30 flex flex-col">
<button class="flex items-center justify-between w-full p-4 hover:bg-surface-container-low transition-colors text-left group border-b border-outline-variant/20 last:border-0">
<span class="font-body-md text-on-surface">Modifier mon profil</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors">chevron_right</span>
</button>
<button class="flex items-center justify-between w-full p-4 hover:bg-surface-container-low transition-colors text-left group border-b border-outline-variant/20 last:border-0">
<span class="font-body-md text-on-surface">Objectifs et santé</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors">chevron_right</span>
</button>
</div>
</section>
<!-- Section: Préférences -->
<section class="flex flex-col gap-base">
<h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider pl-4">Préférences</h2>
<div class="bg-surface-container-lowest rounded-[16px] overflow-hidden shadow-[0_2px_10px_0_rgba(26,34,56,0.02)] border border-outline-variant/30 flex flex-col">
<button class="flex items-center justify-between w-full p-4 hover:bg-surface-container-low transition-colors text-left group border-b border-outline-variant/20 last:border-0">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">straighten</span>
<span class="font-body-md text-on-surface">Unités</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="text-sm">Métriques (kg, cm)</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors">chevron_right</span>
</div>
</button>
<button class="flex items-center justify-between w-full p-4 hover:bg-surface-container-low transition-colors text-left group border-b border-outline-variant/20 last:border-0">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">language</span>
<span class="font-body-md text-on-surface">Langue</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="text-sm">Français</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors">chevron_right</span>
</div>
</button>
<button class="flex items-center justify-between w-full p-4 hover:bg-surface-container-low transition-colors text-left group border-b border-outline-variant/20 last:border-0">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">dark_mode</span>
<span class="font-body-md text-on-surface">Thème</span>
</div>
<div class="flex items-center gap-2 text-on-surface-variant">
<span class="text-sm">Clair</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors">chevron_right</span>
</div>
</button>
</div>
</section>
<!-- Section: Connexions -->
<section class="flex flex-col gap-base">
<h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider pl-4">Connexions</h2>
<div class="bg-surface-container-lowest rounded-[16px] overflow-hidden shadow-[0_2px_10px_0_rgba(26,34,56,0.02)] border border-outline-variant/30 flex flex-col">
<button class="flex items-center justify-between w-full p-4 hover:bg-surface-container-low transition-colors text-left group border-b border-outline-variant/20 last:border-0">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">monitor_heart</span>
<span class="font-body-md text-on-surface">Apple Santé</span>
</div>
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<button class="flex items-center justify-between w-full p-4 hover:bg-surface-container-low transition-colors text-left group border-b border-outline-variant/20 last:border-0">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-outline">fitbit</span>
<span class="font-body-md text-on-surface">Google Fit</span>
</div>
<span class="text-sm text-on-surface-variant group-hover:text-primary-container transition-colors">Connecter</span>
</button>
</div>
</section>
<!-- Section: Confidentialité -->
<section class="flex flex-col gap-base">
<h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider pl-4">Confidentialité</h2>
<div class="bg-surface-container-lowest rounded-[16px] overflow-hidden shadow-[0_2px_10px_0_rgba(26,34,56,0.02)] border border-outline-variant/30 flex flex-col">
<button class="flex items-center justify-between w-full p-4 hover:bg-surface-container-low transition-colors text-left group border-b border-outline-variant/20 last:border-0">
<span class="font-body-md text-on-surface">RGPD &amp; Données</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors">chevron_right</span>
</button>
<button class="flex items-center justify-between w-full p-4 hover:bg-red-50/50 transition-colors text-left group border-b border-outline-variant/20 last:border-0">
<span class="font-body-md text-[#FF6B6B]">Supprimer mon compte</span>
<span class="material-symbols-outlined text-[#FF6B6B]">person_remove</span>
</button>
</div>
</section>
<!-- Section: Application -->
<section class="flex flex-col gap-base">
<h2 class="font-label-bold text-label-bold text-on-surface-variant uppercase tracking-wider pl-4">Application</h2>
<div class="bg-surface-container-lowest rounded-[16px] overflow-hidden shadow-[0_2px_10px_0_rgba(26,34,56,0.02)] border border-outline-variant/30 flex flex-col">
<div class="flex items-center justify-between w-full p-4 border-b border-outline-variant/20 last:border-0">
<span class="font-body-md text-on-surface">Version</span>
<span class="text-sm text-on-surface-variant">v2.4.1</span>
</div>
<button class="flex items-center justify-between w-full p-4 hover:bg-surface-container-low transition-colors text-left group border-b border-outline-variant/20 last:border-0">
<span class="font-body-md text-on-surface">Conditions générales</span>
<span class="material-symbols-outlined text-outline group-hover:text-primary-container transition-colors">open_in_new</span>
</button>
</div>
</section>
<!-- Global Action: Logout -->
<div class="mt-8 mb-12 px-4">
<button class="w-full py-4 bg-surface-container-lowest border border-[#FF6B6B]/20 rounded-full flex items-center justify-center gap-2 hover:bg-[#FF6B6B]/5 transition-colors active:scale-[0.98] duration-150 shadow-sm">
<span class="material-symbols-outlined text-[#FF6B6B]">logout</span>
<span class="font-label-bold text-label-bold text-[#FF6B6B] uppercase tracking-wide">Se déconnecter</span>
</button>
</div>
</main>
