<button class="flex flex-col items-center justify-center gap-3 p-6 rounded-[16px] bg-[#EAF8F6] border-2 border-[#2EC4B6] transition-all hover:bg-[#EAF8F6] text-center aspect-square shadow-sm relative overflow-hidden group">
<div class="absolute inset-0 bg-[#2EC4B6]/5 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<div class="w-16 h-16 rounded-full bg-white flex items-center justify-center text-[#2EC4B6] shadow-sm mb-2">

</div>

</button>

<button class="flex flex-col items-center justify-center gap-3 p-6 rounded-[16px] bg-surface-container-lowest border border-outline-variant/30 transition-all hover:bg-surface-container-low hover:border-outline-variant text-center aspect-square shadow-sm relative overflow-hidden group">
