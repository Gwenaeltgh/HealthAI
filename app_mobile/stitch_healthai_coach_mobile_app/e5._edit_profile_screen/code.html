<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for webkit */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #bbcac6;
            border-radius: 10px;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased selection:bg-primary-container/30 selection:text-primary">
<!-- Top Navigation Header (Destination / Task-focused) -->
<header class="flex justify-between items-center w-full px-container-padding py-4 sticky top-0 bg-background/90 backdrop-blur-md z-40 border-b border-outline-variant/20">
<button class="font-label-bold text-label-bold text-on-surface-variant hover:text-on-surface transition-colors">
            Annuler
        </button>
<h1 class="font-label-bold text-label-bold text-on-surface tracking-wide">
            Modifier le profil
        </h1>
<button class="font-label-bold text-label-bold text-primary-container hover:opacity-80 transition-opacity">
            Enregistrer
        </button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-xl mx-auto px-container-padding pt-section-gap pb-[100px] flex flex-col gap-section-gap">
<!-- Avatar Section -->
<section class="flex flex-col items-center justify-center">
<div class="relative w-[100px] h-[100px] rounded-full overflow-hidden shadow-sm border-[3px] border-surface-container-lowest mb-4">
<img alt="Profile avatar" class="w-full h-full object-cover" data-alt="A highly detailed, professional headshot portrait of an approachable French millennial. The lighting is soft and natural, creating a bright, modern light-mode aesthetic against a muted background. The overall mood is healthy, energetic, and clinically precise yet warm. Sophisticated palette with subtle teal accents emphasizing a human-centric wellness approach." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHKtkCXjDYZMR68MKBWX9FBSi8EjuA4nIVM8z0jCFzBA778Up-WZ3FZm6kzFxQOAtMycFsm0ndLwR6D6Iwa1zfNqUR6wMBJhcAauEeI8paD3GO2DjieauOMdDSTUHbW-xn-xNO4ndMRD50GpCFXpp6Y26pepd8LZO13tYxIpcqZfcdnHGeKXl_AzwPWphQxubvd1dm3r8dsXtVlk8OyMsDoxa0NYnfMrhMBvumeYxMYOuO5RDCOWQLTUwf58YV34I6_u2yxGkIb-wg"/>
</div>
<button class="font-label-bold text-label-bold text-primary-container bg-primary-container/10 px-4 py-2 rounded-full hover:bg-primary-container/20 transition-colors">
                Modifier la photo
            </button>
</section>
<!-- Form Sections -->
<form class="flex flex-col gap-section-gap">
<!-- Informations Publiques -->
<div class="flex flex-col gap-stack-gap">
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="display-name">Nom d'affichage</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-[16px] px-4 py-3.5 text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-sm" id="display-name" type="text" value="Alexandre Dubois"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="username">Nom d'utilisateur</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-[16px] px-4 py-3.5 text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-sm" id="username" type="text" value="@orias"/>
</div>
<div class="flex flex-col gap-2 relative">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="bio">Bio</label>
<textarea class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-[16px] px-4 py-3.5 text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-sm resize-none" id="bio" rows="3">Amateur de randonnée et en quête d'un mode de vie plus sain. Accompagné par HealthAI !</textarea>
<span class="absolute bottom-3 right-4 font-label-bold text-[11px] text-outline">89/150</span>
</div>
</div>
<!-- Données Physiques & Démographiques -->
<div class="flex flex-col gap-stack-gap">
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="birthdate">Date de naissance</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-[16px] px-4 py-3.5 text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-sm" id="birthdate" type="date" value="1995-08-14"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">Sexe</label>
<div class="flex w-full bg-surface-container-lowest border border-outline-variant/40 rounded-[16px] p-1 shadow-sm">
<button class="flex-1 py-2.5 rounded-[12px] bg-primary-container text-white font-label-bold text-label-bold shadow-sm transition-all" type="button">Homme</button>
<button class="flex-1 py-2.5 rounded-[12px] text-on-surface-variant font-label-bold text-label-bold hover:bg-surface-variant/30 transition-all" type="button">Femme</button>
<button class="flex-1 py-2.5 rounded-[12px] text-on-surface-variant font-label-bold text-label-bold hover:bg-surface-variant/30 transition-all" type="button">Autre</button>
</div>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="height">Taille (cm)</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-[16px] px-4 py-3.5 text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-sm" id="height" type="number" value="178"/>
</div>
<div class="flex flex-col gap-2">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="weight">Poids actuel (kg)</label>
<input class="w-full bg-surface-container-lowest border border-outline-variant/40 rounded-[16px] px-4 py-3.5 text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-sm" id="weight" step="0.1" type="number" value="75.4"/>
</div>
</div>
</div>
<!-- Paramètres de Coaching -->
<div class="flex flex-col gap-stack-gap">
<div class="flex flex-col gap-2 relative">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="activity-level">Niveau d'activité</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant/40 rounded-[16px] px-4 py-3.5 text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-sm pr-10" id="activity-level">
<option>Sédentaire</option>
<option selected="">Légèrement actif</option>
<option>Actif</option>
<option>Très actif</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2 relative">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1" for="goal">Objectif principal</label>
<div class="relative">
<select class="w-full appearance-none bg-surface-container-lowest border border-outline-variant/40 rounded-[16px] px-4 py-3.5 text-body-md text-on-surface focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all shadow-sm pr-10" id="goal">
<option>Perte de poids</option>
<option selected="">Maintien et remise en forme</option>
<option>Prise de masse musculaire</option>
<option>Amélioration du sommeil</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline-variant pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</div>
</form>
</main>
</body></html>
