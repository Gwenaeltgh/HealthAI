<body class="bg-[#1A2238]/40 h-screen w-full flex items-end justify-center sm:items-center sm:p-4 font-body-md text-on-surface antialiased overflow-hidden">
<!-- Modal Container -->
<main class="w-full max-w-[480px] bg-[#FFFCF7] rounded-t-4xl sm:rounded-4xl shadow-2xl flex flex-col max-h-[795px] overflow-y-auto">
<!-- Drag Handle (Mobile) -->
<div class="w-full flex justify-center pt-4 pb-2 sm:hidden">
<div class="w-12 h-1.5 bg-outline-variant rounded-full"></div>
</div>
<!-- Header -->
<header class="flex justify-between items-center px-container-padding py-4 border-b border-[#1A2238]/10 sticky top-0 bg-[#FFFCF7] z-10">
<button class="text-label-bold font-label-bold text-on-surface-variant hover:text-on-surface transition-colors" type="button">
                Annuler
            </button>
<h1 class="font-h2-editorial text-h2-editorial text-[#1A2238]">Nouvelle pesée</h1>
<button class="text-label-bold font-label-bold text-primary-container hover:text-primary transition-colors" type="button">
                Enregistrer
            </button>
</header>
<!-- Content Canvas -->
<div class="px-container-padding py-section-gap flex flex-col gap-section-gap">
<!-- Mascot & Context -->
<div class="flex flex-col items-center gap-stack-gap">
<div class="w-24 h-24 rounded-full bg-surface-container-lowest border-2 border-primary-container/20 flex items-center justify-center p-2 shadow-sm">
<img alt="L'Avocat Mascot" class="w-full h-full object-contain mix-blend-multiply opacity-90" data-alt="A flat 2D illustration of a cute avocado mascot character with a warm, encouraging smile. The character is simple and modern, fitting a light-mode health-tech aesthetic with soft cream backgrounds and vibrant primary green accents. The mascot should feel supportive and approachable." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAoXQJwP6R8e1HdgM34t2zLjqxHivGjw24R27EURcPcrsYDwrPYAlZqouF7Z8jyRa1MnaX1K87Zr-YVOtHk8SQDoAZ385kTTiQUob4VWGRXO-tp1PTUdH7_BsVsjSMTpAurWulekStoAlifs1jwf-8n6E6h-ypqk-ErQN4VqFnaeXV1ln_SPi3alA1pVnWnk2KaxKQvprAqprZy2YV-ucMmzhSti4OZ8FABxzGpPRqIFEdo1l1tqWTi3xHNPwQ2AD0Y--Hk5UKHpNW4"/>
</div>
<p class="font-body-md text-body-md text-on-surface-variant text-center max-w-[280px]">
                    C'est l'heure du bilan ! Comment vous sentez-vous aujourd'hui ?
                </p>
</div>
<!-- Weight Input Wheel Area -->
<div class="flex flex-col items-center gap-base">
<div class="relative w-full py-8 flex justify-center items-center overflow-hidden">
<!-- Selector Highlights -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-[72px] border-y-2 border-primary-container/30 bg-primary-container/5 pointer-events-none z-0"></div>
<!-- Scrollable Wheel (Mockup via flex) -->
<div class="flex items-center gap-6 overflow-x-auto hide-scrollbar w-full px-[50%] snap-x snap-mandatory relative z-10" style="scroll-snap-type: x mandatory;">
<div class="snap-center shrink-0 font-display-metrics text-display-metrics text-on-surface-variant/30">72.0</div>
<div class="snap-center shrink-0 font-display-metrics text-display-metrics text-on-surface-variant/50">73.0</div>
<div class="snap-center shrink-0 font-display-metrics text-display-metrics text-[#1A2238]">74.0</div>
<div class="snap-center shrink-0 font-display-metrics text-display-metrics text-on-surface-variant/50">75.0</div>
<div class="snap-center shrink-0 font-display-metrics text-display-metrics text-on-surface-variant/30">76.0</div>
</div>
</div>
<span class="font-label-bold text-label-bold text-primary-container tracking-widest uppercase">Kilogrammes</span>
</div>
<!-- Date Picker Row -->
<div class="flex items-center justify-between p-4 bg-surface-container-lowest rounded-xl border border-[#1A2238]/10 shadow-sm">
<div class="flex items-center gap-3 text-on-surface">
<span class="material-symbols-outlined text-on-surface-variant">calendar_today</span>
<span class="font-body-md text-body-md">Aujourd'hui, 14 Nov</span>
</div>
<button class="font-label-bold text-label-bold text-primary-container hover:bg-primary-container/10 px-3 py-1 rounded-full transition-colors">
                    Modifier
                </button>
</div>
<!-- Optional Notes -->
<div class="flex flex-col gap-base">
<label class="font-label-bold text-label-bold text-[#1A2238]" for="weight-notes">Notes (optionnel)</label>
<textarea class="w-full rounded-xl border-[#1A2238]/10 bg-surface-container-lowest p-4 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all resize-none shadow-sm" id="weight-notes" placeholder="Comment s'est passée votre semaine ?" rows="3"></textarea>
</div>
<!-- Toggle Share -->
<div class="flex items-center justify-between p-4 bg-primary-container/5 rounded-xl border border-primary-container/10">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary-container filled">forum</span>
<div class="flex flex-col">
<span class="font-label-bold text-label-bold text-[#1A2238]">Partager dans le feed</span>
<span class="font-body-md text-[13px] leading-tight text-on-surface-variant">Inspirer la communauté</span>
</div>
</div>
<!-- Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox" value=""/>
<div class="w-11 h-6 bg-surface-variant peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-outline-variant after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary-container"></div>
</label>
</div>
</div>
